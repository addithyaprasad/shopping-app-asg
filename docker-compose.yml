services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    environment:
      PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: shopdb
      DB_USER: shopuser
      DB_PASSWORD: shoppass
      CORS_ORIGIN: http://localhost:8080
      NODE_ENV: development
    ports:
      - "8081:8081"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
